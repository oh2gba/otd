name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in Docker
        run: ./build.sh

  linux-appimage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: ./package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: otd-linux-appimage
          path: dist/*.AppImage

  windows:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: ./package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: otd-windows-x64
          path: |
            dist/*.zip
            dist/*.exe

  macos:
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          brew install ninja
          pip3 install --break-system-packages aqtinstall
          aqt install-qt --outputdir "$HOME/qt" mac desktop 6.8.3 clang_64 -m qtwebsockets qtmultimedia --archives qtbase qtdeclarative qtwebsockets qtmultimedia
      - name: Build Hamlib's rigctld for both architectures
        run: |
          HV=4.7.2
          curl -sL -o hamlib.tar.gz "https://github.com/Hamlib/Hamlib/releases/download/$HV/hamlib-$HV.tar.gz"
          tar xzf hamlib.tar.gz
          for arch in arm64 x86_64; do
            host=$([ "$arch" = arm64 ] && echo aarch64-apple-darwin || echo x86_64-apple-darwin)
            # a fresh extraction per architecture keeps the tarball's time stamps,
            # so make does not try to regenerate configure (no autoconf on the runner)
            rm -rf "hamlib-build-$arch" && mkdir "hamlib-build-$arch" \
              && tar xzf hamlib.tar.gz -C "hamlib-build-$arch" --strip-components=1
            ( cd "hamlib-build-$arch" && \
              CFLAGS="-arch $arch -mmacosx-version-min=12.0" LDFLAGS="-arch $arch -mmacosx-version-min=12.0" \
              ./configure --host="$host" --prefix="$PWD/../hamlib-$arch" --disable-shared --enable-static \
                --without-cxx-binding --without-perl-binding --without-python-binding \
                --without-tcl-binding --without-lua-binding --without-libusb >/dev/null && \
              make -j"$(sysctl -n hw.ncpu)" >/dev/null && make install >/dev/null )
          done
          mkdir -p hamlib-universal
          lipo -create hamlib-arm64/bin/rigctld hamlib-x86_64/bin/rigctld -output hamlib-universal/rigctld
          cp "hamlib-$HV/COPYING.LIB" hamlib-universal/
          lipo -info hamlib-universal/rigctld
          hamlib-universal/rigctld -l | head -3
      - name: Build universal app bundle
        run: |
          QT="$HOME/qt/6.8.3/macos"
          VERSION=$(sed -n 's/^project(otd VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT" -DOTD_BUILD_TESTS=OFF \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build
          # rigctld inside the bundle, where otd looks first
          mkdir -p build/otd.app/Contents/MacOS/hamlib build/otd.app/Contents/Resources/licenses/hamlib
          cp hamlib-universal/rigctld build/otd.app/Contents/MacOS/hamlib/
          cp hamlib-universal/COPYING.LIB build/otd.app/Contents/Resources/licenses/hamlib/
          build/otd.app/Contents/MacOS/hamlib/rigctld --version
          "$QT/bin/macdeployqt" build/otd.app -dmg
          mkdir -p dist && mv build/otd.dmg "dist/otd-$VERSION-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: otd-macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [linux-appimage, windows, macos]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version-free file names, so /releases/latest/download/ links stay valid
        run: |
          cd dist
          for f in otd-*; do mv "$f" "$(echo "$f" | sed -E 's/^otd-[0-9.]+-/otd-/')"; done
          sha256sum * > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
